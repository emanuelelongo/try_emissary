---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pasta
  labels:
    app: pasta
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pasta
  template:
    metadata:
      labels:
        app: pasta
    spec:
      containers:
        - name: pasta
          image: hashicorp/http-echo
          args:
            - "-text=🍝"
            - "-listen=:8080"
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: pasta
spec:
  ports:
  - name: http
    port: 80
    targetPort: 8080
  selector:
    app: pasta
