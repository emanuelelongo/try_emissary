---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sushi
  labels:
    app: sushi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sushi
  template:
    metadata:
      labels:
        app: sushi
    spec:
      containers:
        - name: sushi
          image: hashicorp/http-echo
          args:
            - "-text=🍣"
            - "-listen=:8080"
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: sushi
spec:
  ports:
  - name: http
    port: 80
    targetPort: 8080
  selector:
    app: sushi
