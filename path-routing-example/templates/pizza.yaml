---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pizza
  labels:
    app: pizza
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pizza
  template:
    metadata:
      labels:
        app: pizza
    spec:
      containers:
        - name: pizza
          image: hashicorp/http-echo
          args:
            - "-text=🍕"
            - "-listen=:8080"
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: pizza
spec:
  ports:
  - name: http
    port: 80
    targetPort: 8080
  selector:
    app: pizza
