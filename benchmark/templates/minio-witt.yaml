apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio-witt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio-witt
  template:
    metadata:
      labels:
        app: minio-witt
    spec:
      containers:
      - name: minio-witt
        image: quay.io/minio/minio:latest
        args:
        - server
        - /data
        - --address
        - ":8080"
        - --console-address
        - ":9001"
        env:
        - name: MINIO_ROOT_USER
          value: "minioadmin"
        - name: MINIO_ROOT_PASSWORD
          value: "minioadmin"
        - name: MINIO_DOMAIN
          value: "test.lcl"
        ports:
        - containerPort: 8080
        - containerPort: 9001
---
apiVersion: v1
kind: Service
metadata:
  name: minio-witt
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: api
    - port: 9001
      targetPort: 9001
      name: console
  selector:
    app: minio-witt